name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Check Python source
        run: python -m py_compile APK_Donusturucu_v6_1.py

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name APK_Donusturucu_Pro_v6_1 APK_Donusturucu_v6_1.py

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path "dist\APK_Donusturucu_Pro_v6_1.exe")) { throw "EXE was not created" }
          Get-Item "dist\APK_Donusturucu_Pro_v6_1.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK_Donusturucu_Pro_v6_1_Windows_x64
          path: dist/APK_Donusturucu_Pro_v6_1.exe
          if-no-files-found: error
          retention-days: 30
