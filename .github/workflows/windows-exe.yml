name: Windows EXE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up current Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'

      - name: Diagnose Android 17 packages
        shell: pwsh
        run: |
          sdkmanager --list --channel=3 | Select-String -Pattern 'android-37|Cinnamon|build-tools;37|build-tools;36.0.0' | Select-Object -First 80

      - name: Install Android 17 SDK
        shell: pwsh
        run: |
          sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Apply v7 runtime fixes
        shell: pwsh
        run: |
          $p = 'APK_Donusturucu_v6_1.py'
          $c = Get-Content $p -Raw
          $c = $c.Replace("VERSION='6.1'", "VERSION='7.0'")
          $c = $c.Replace("run_capture([str(sm),*miss],env=env,timeout=600)", "run_capture([str(sm),'--channel=3',*miss],env=env,timeout=600)")
          Set-Content -Path $p -Value $c -Encoding UTF8

      - name: Check Python source
        run: python -m py_compile APK_Donusturucu_v6_1.py ci_smoke_test.py

      - name: Real Android APK smoke test
        run: python ci_smoke_test.py

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name APK_Donusturucu_Pro_v7 APK_Donusturucu_v6_1.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist\APK_Donusturucu_Pro_v7.exe")) { throw "EXE was not created" }
          $f = Get-Item "dist\APK_Donusturucu_Pro_v7.exe"
          if ($f.Length -lt 5000000) { throw "EXE is unexpectedly small" }
          $f | Format-List Name,Length,LastWriteTime

      - name: Upload validated EXE
        uses: actions/upload-artifact@v4
        with:
          name: APK_Donusturucu_Pro_v7_Validated_Windows_x64
          path: dist/APK_Donusturucu_Pro_v7.exe
          if-no-files-found: error
          retention-days: 30
