name: Windows EXE Build

on:
  push:
    branches: [ main ]
    paths:
      - 'APK_Donusturucu.py'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Syntax check
        shell: pwsh
        run: python -m py_compile APK_Donusturucu.py

      - name: Build EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name APK_Donusturucu APK_Donusturucu.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/APK_Donusturucu.exe')) { throw 'EXE üretilmedi' }
          Get-Item 'dist/APK_Donusturucu.exe' | Format-List Name,Length,LastWriteTime

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: APK_Donusturucu_Windows_x64
          path: dist/APK_Donusturucu.exe
          if-no-files-found: error
          retention-days: 30
